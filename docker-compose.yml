services:
  agent-memory-engine:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: agent-memory-engine
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MEMORY_DB_PATH: /data/lance
      LOG_DIR: /app/logs

    ports:
      - "8000:8000"

    volumes:
      - ame_lance_data:/data/lance
      - ame_logs:/app/logs

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ame_lance_data:
  ame_logs:
